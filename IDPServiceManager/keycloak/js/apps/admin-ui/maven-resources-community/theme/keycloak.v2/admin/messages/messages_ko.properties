unmanagedAttributes=관리되지 않는 속성
unmanagedAttributesHelpText=관리되지 않는 속성은 사용자 프로필 구성에 명시적으로 정의되지 않은 사용자 속성입니다. \
  기본적으로 관리되지 않는 속성은 `비활성화됨` 상태이며, 등록, 계정, 관리자 콘솔과 같은 어떤 컨텍스트에서도 사용할 수 없습니다. \
  `활성화됨`으로 설정하면, 관리되지 않는 속성이 서버에 의해 완전히 인식되고 모든 컨텍스트에서 접근할 수 있어, 기존 Realm을 선언형 사용자 프로필로 마이그레이션하는 중이며 아직 모든 사용자 속성이 프로필에 정의되지 않은 경우 유용합니다. \
  `관리자만 작성 가능`으로 설정하면, 관리되지 않는 속성은 관리자 콘솔과 API를 통해서만 관리할 수 있으며, 사용자가 관리할 수 있는 사용자 정의 속성은 이미 정의되어 있지만 다른 속성은 관리자만 관리하도록 하고 싶을 때 유용합니다. \
  `관리자만 보기 가능`으로 설정하면, 관리되지 않는 속성은 읽기 전용이며 관리자 콘솔과 API를 통해서만 확인할 수 있습니다.
